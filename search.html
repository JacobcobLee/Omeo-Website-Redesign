<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>OMEO — Search Results</title>
    <link rel="stylesheet" href="styles/main.css">
  </head>

  <body class="dark-theme">

    <!-- ===== NAV ===== -->
    <header class="topbar topbar--solid">
      <div class="container topbar-inner">
        <a class="brand" href="index.html">OMEO</a>

        <nav class="main-nav" aria-label="Main navigation">
          <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="search.html" aria-current="page">CATALOGUE</a></li>
            <li><a href="index.html#about">ABOUT</a></li>
            <li><a href="index.html#contact">CONTACT</a></li>
          </ul>
        </nav>

        <div class="nav-actions">
          <div class="search" role="search">
            <input type="search" placeholder="Search…" aria-label="Search" id="headerSearch">
            <button type="button" aria-label="Search" onclick="runSearch()">🔍</button>
          </div>
          <button class="cart" type="button" aria-label="View cart" onclick="location.href='cart.html'">
            🛒
            <span class="cart-badge" id="cartBadge" hidden>0</span>
          </button>
        </div>

        <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <!-- Mobile menu -->
    <div class="mobile-menu" id="mobileMenu" aria-hidden="true" role="dialog" aria-label="Navigation">
      <div class="mobile-menu-header">
        <a class="brand" href="index.html">OMEO</a>
        <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Close menu">✕</button>
      </div>
      <div class="mobile-search">
        <input type="search" placeholder="Search products…" id="mobileSearch">
        <button type="button" aria-label="Search" onclick="if(document.getElementById('mobileSearch').value.trim())location.href='search.html?q='+encodeURIComponent(document.getElementById('mobileSearch').value.trim())">🔍</button>
      </div>
      <nav class="mobile-nav">
        <a href="index.html">HOME</a>
        <a href="search.html">CATALOGUE</a>
        <a href="index.html#about">ABOUT US</a>
        <a href="index.html#contact">CONTACT</a>
      </nav>
      <div class="mobile-nav-cart">
        <span>🛒</span>
        <a href="cart.html" style="color:#fff;text-decoration:none">View Cart</a>
        <span class="cart-badge" id="cartBadgeMobile" hidden>0</span>
      </div>
    </div>

    <main>

      <!-- ===== SEARCH HEADER ===== -->
      <section class="page-search-header container" aria-label="Search">
        <div class="search-bar-large">
          <input
            type="search"
            id="searchInput"
            placeholder="Search products, brands, gear…"
            aria-label="Search products"
            autocomplete="off">
          <button type="button" aria-label="Search" onclick="runSearch()">🔍</button>
        </div>
        <p class="did-you-mean" id="didYouMean" hidden>
          Did you mean: <a href="#" id="didYouMeanLink"></a>?
        </p>
      </section>

      <!-- ===== FILTER BAR ===== -->
      <div class="filter-bar container">
        <p class="results-count" id="resultsCount">7 results</p>
        <div>
          <label for="sortSelect" style="color:#8d99ae;font-size:0.9rem;margin-right:0.5rem">Sort by:</label>
          <select id="sortSelect" onchange="renderProducts()">
            <option value="relevance">Relevance</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
          </select>
        </div>
      </div>

      <!-- ===== PRODUCT GRID ===== -->
      <section class="container" aria-label="Search results" style="padding-top:0">
        <div class="product-grid" id="productGrid"></div>
      </section>

      <!-- ===== IN YOUR CART ===== -->
      <section class="container cart-preview-section" aria-label="Your cart" id="cartPreviewSection">
        <h2>In your cart…</h2>
        <div id="cartPreview"></div>
        <div class="cart-preview-actions" id="cartPreviewActions" hidden>
          <a href="cart.html" class="btn-primary">View Cart</a>
          <a href="index.html" class="btn-outline">Continue Shopping</a>
        </div>
      </section>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="site-footer site-footer--dark" aria-label="Site footer">
      <div class="container footer-inner">
        <nav class="footer-nav" aria-label="Footer navigation">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
            <li><a href="search.html">Products</a></li>
            <li><a href="#">Terms and conditions</a></li>
          </ul>
        </nav>
        <div class="footer-social" aria-label="Social links">
          <a href="#" aria-label="Instagram" class="social-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
            </svg>
          </a>
          <a href="#" aria-label="Facebook" class="social-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
            </svg>
          </a>
        </div>
      </div>
      <div class="footer-bottom">© 2026 BILLIE'S OMEO SKI HIRE</div>
    </footer>

    <script src="script/main.js"></script>
    <script>
      /* ============================================================
         Search page data & logic
         ============================================================ */
      const ALL_PRODUCTS = [
        {
          id: 'snowboard',
          name: "Turbo Men's Snowboard",
          category: 'Snowboards',
          price: 699,
          img: 'https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=600&q=80'
        },
        {
          id: 'hoodie',
          name: 'Essentials Cotton Hoodie',
          category: 'Apparel',
          price: 89,
          img: 'https://images.unsplash.com/photo-1511735643442-503bb3bd348a?auto=format&fit=crop&w=600&q=80'
        },
        {
          id: 'bindings-hydra',
          name: 'Hydra-Flex Pro Bindings',
          category: 'Bindings',
          price: 249,
          img: 'https://images.unsplash.com/photo-1516834473878-62f9f8f5fa32?auto=format&fit=crop&w=600&q=80'
        },
        {
          id: 'skis-azure',
          name: 'Azure Velocity Skis',
          category: 'Skis',
          price: 599,
          img: 'https://images.unsplash.com/photo-1544976503-898a7f7f0c2b?auto=format&fit=crop&w=600&q=80'
        },
        {
          id: 'bag-pro',
          name: 'Bag Pro',
          category: 'Accessories',
          price: 129,
          img: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80'
        },
        {
          id: 'booties',
          name: 'Booties',
          category: 'Footwear',
          price: 79,
          img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80'
        },
        {
          id: 'bindings-blaster',
          name: 'Blaster AsymWrap Bindings',
          category: 'Bindings',
          price: 199,
          img: 'https://images.unsplash.com/photo-1536530077-f174cdab35f9?auto=format&fit=crop&w=600&q=80'
        }
      ];

      /* --- Render product grid --- */
      function renderProducts() {
        const sort    = document.getElementById('sortSelect').value;
        const query   = (document.getElementById('searchInput').value || '').trim().toLowerCase();
        const grid    = document.getElementById('productGrid');
        const counter = document.getElementById('resultsCount');

        let list = [...ALL_PRODUCTS];

        // Filter by query
        if (query) {
          list = list.filter(p =>
            p.name.toLowerCase().includes(query) ||
            p.category.toLowerCase().includes(query)
          );
          // Show "did you mean" for snowboard typo demo
          const dym     = document.getElementById('didYouMean');
          const dymLink = document.getElementById('didYouMeanLink');
          if (query === 'snowbaord' || query === 'snwoboard') {
            dymLink.textContent = "Turbo Men's Snowboard";
            dymLink.href = 'product.html?id=snowboard';
            dym.hidden = false;
          } else {
            dym.hidden = true;
          }
        }

        // Sort
        if (sort === 'price-asc')  list.sort((a, b) => a.price - b.price);
        if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);

        counter.textContent = list.length + ' result' + (list.length !== 1 ? 's' : '');

        if (list.length === 0) {
          grid.innerHTML = '<p style="color:#8d99ae;grid-column:1/-1">No products found. Try a different search.</p>';
          return;
        }

        grid.innerHTML = list.map(p => `
          <article class="product-card" onclick="location.href='product.html?id=${p.id}'">
            <img src="${p.img}" alt="${p.name}" loading="lazy">
            <div class="product-body">
              <div class="product-body-row">
                <div>
                  <p class="product-card-category">${p.category}</p>
                  <h3>${p.name}</h3>
                  <p class="product-card-price">$${p.price}</p>
                </div>
                <button
                  class="card-add"
                  type="button"
                  aria-label="Add ${p.name} to cart"
                  onclick="event.stopPropagation(); handleAddToCart(${JSON.stringify(p).replace(/"/g, '&quot;')})">+</button>
              </div>
            </div>
          </article>
        `).join('');
      }

      /* --- Add to cart with feedback --- */
      function handleAddToCart(product) {
        addToCart(product);
        renderCartPreview();
        // Flash button feedback via brief class toggle
        const btn = event.currentTarget;
        btn.textContent = '✓';
        btn.style.background = '#e63946';
        btn.style.color = '#fff';
        btn.style.borderColor = '#e63946';
        setTimeout(() => {
          btn.textContent = '+';
          btn.style.background = '';
          btn.style.color = '';
          btn.style.borderColor = '';
        }, 900);
      }

      /* --- Render "In your cart" preview --- */
      function renderCartPreview() {
        const cart    = getCart();
        const preview = document.getElementById('cartPreview');
        const actions = document.getElementById('cartPreviewActions');

        if (cart.length === 0) {
          preview.innerHTML = '<p class="cart-preview-empty">Your cart is empty.</p>';
          actions.hidden = true;
          return;
        }

        preview.innerHTML = `
          <div class="cart-preview-list">
            ${cart.map(item => `
              <div class="cart-preview-item">
                <img src="${item.img}" alt="${item.name}">
                <div class="cart-preview-item-info">
                  <strong>${item.name}</strong>
                  <p>${item.category} &middot; Qty: ${item.qty}</p>
                </div>
                <span class="cart-preview-item-price">$${(item.price * item.qty).toLocaleString()}</span>
              </div>
            `).join('')}
          </div>`;
        actions.hidden = false;
      }

      /* --- Search trigger --- */
      function runSearch() {
        renderProducts();
      }

      /* --- Read ?q= from URL and pre-fill --- */
      function initSearchPage() {
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q') || '';
        if (q) {
          document.getElementById('searchInput').value = q;
          document.getElementById('headerSearch').value = q;
        }
        renderProducts();
        renderCartPreview();

        // Live filter on Enter key
        document.getElementById('searchInput').addEventListener('keydown', e => {
          if (e.key === 'Enter') renderProducts();
        });
      }

      document.addEventListener('DOMContentLoaded', initSearchPage);
    </script>
  </body>
</html>
